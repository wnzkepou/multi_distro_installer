[project]
name = "multiboot-btrfs-workstation"
version = "0.1.0"
description = "Dual-architecture (arm64 & amd64) multi-distro Btrfs developer workstation, Secure Boot, and Windows 11 KVM bootstrapper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter (allows long XML/shell strings)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = [
    "multiboot_common.py",
    "multi_distro_installer.py",
    "multiboot_maint.py",
    "win11_vm.py",
]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
