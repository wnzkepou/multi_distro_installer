name: CI Lint, Type Check & Dual-Arch Matrix
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  quality:
    name: Python ${{ matrix.python-version }} (${{ matrix.sim-arch }})
    runs-on: ubuntu-latest
    strategy:
    fail-fast: false
    matrix:
      python-version: ["3.11", "3.12"]
      sim-arch: ["aarch64", "x86_64"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v5
        with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
      - name: Install linter & type checker
        run: uv pip install --system ruff mypy
      - name: Run Ruff linter across all scripts
        run: ruff check multiboot_common.py multi_distro_installer.py multiboot_maint.py win11_vm.py
      - name: Run Ruff formatter check
        run: ruff format --check multiboot_common.py multi_distro_installer.py multiboot_maint.py win11_vm.py
      - name: Run Mypy static type check across all scripts
        run: mypy --ignore-missing-imports multiboot_common.py multi_distro_installer.py multiboot_maint.py win11_vm.py
      - name: Verify dual-architecture resolution & module contracts
        env:
          SIM_ARCH: ${{ matrix.sim-arch }}
        run: |
          python3 -c "
          import os, platform
          import multi_distro_installer as inst
          import multiboot_maint as maint
          import win11_vm as vm
          sim = os.environ['SIM_ARCH']
          platform.machine = lambda: sim
          arch_info = inst.get_arch_spec()
          vm_info = vm.get_vm_arch_spec()
          if sim == 'aarch64':
          assert arch_info['family'] == 'arm64'
          assert arch_info['efi_suffix'] == 'aa64'
          assert vm_info['machine'] == 'virt'
          assert vm_info['tpm_model'] == 'tpm-tis-device'
          else:
          assert arch_info['family'] == 'amd64'
          assert arch_info['efi_suffix'] == 'x64'
          assert vm_info['machine'] == 'q35'
          assert vm_info['tpm_model'] == 'tpm-crb'
          assert len(inst.DISTROS) == 6

